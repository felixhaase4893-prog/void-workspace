<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="VOID – a free, local-first workspace for developers." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>VOID</title>
    <style>
      /* Startup screen, painted before any script or stylesheet has loaded. React replaces it. */
      html, body { margin: 0; background: #08080b; }
      .boot { display: grid; place-items: center; min-height: 100vh; font: 13px system-ui, sans-serif; color: #6e6e7e; }
      .boot img { display: block; width: 40px; height: 40px; margin: 0 auto 16px; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status"><div><img src="/favicon.svg" alt="" />Starting VOID…</div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
